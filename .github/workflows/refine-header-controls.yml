name: Refine header controls
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refine-header-controls.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine currency and language sizing
        shell: bash
        run: |
          cat >> dist/style.css <<'CSS'

/* Refined compact header controls */
.currency-select{font-size:12px!important;line-height:1.2!important;max-width:98px!important;padding:6px 3px!important;min-height:30px!important}
.language-switch{font-size:11px!important;line-height:1!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;width:auto!important;height:30px!important;min-height:30px!important;padding:0 9px!important;white-space:nowrap!important;writing-mode:horizontal-tb!important;transform:none!important}
html[dir="rtl"] .language-switch{writing-mode:horizontal-tb!important;direction:ltr!important}
@media(max-width:850px){.currency-select{font-size:11px!important;max-width:88px!important}.language-switch{font-size:10px!important;height:28px!important;min-height:28px!important;padding:0 7px!important}}
@media(max-width:540px){.currency-select{font-size:11px!important;max-width:84px!important}.language-switch{font-size:10px!important;height:27px!important;min-height:27px!important;padding:0 6px!important}}
CSS
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/style.css
          git commit -m 'fix: enlarge currency text and horizontal language control' || exit 0
          git push