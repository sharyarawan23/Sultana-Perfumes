name: Restore perfume vertical collection banners
on:
  push:
    paths:
      - '.github/workflows/restore-collection-banner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix perfume collection banners on desktop and mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          home=Path('dist/index.html')
          s=home.read_text()
          s=re.sub(r'<section class="section-shell" id="collection-showcase".*?</section>\s*', '', s, count=1, flags=re.S)
          home.write_text(s)

          shop=Path('dist/shop/index.html')
          s=shop.read_text()
          s=re.sub(r'<section class="perfume-collection-banners".*?</section>\s*', '', s, count=1, flags=re.S)
          s=re.sub(r'<style id="perfume-collection-responsive-fix">.*?</style>', '', s, count=1, flags=re.S)
          marker='<section class="shop-section section-shell" id="collection">'
          block='''<section class="perfume-collection-banners" aria-label="Perfume collections"><a class="perfume-collection-banner" href="/shop/?collection=men#collection" aria-label="Shop Men perfumes"><img src="/assets/collections-square/men-collection-vertical.webp" alt="Men perfume collection" loading="eager"></a><a class="perfume-collection-banner" href="/shop/?collection=women#collection" aria-label="Shop Women perfumes"><img src="/assets/collections-square/women-collection-vertical.webp" alt="Women perfume collection" loading="eager"></a><a class="perfume-collection-banner" href="/shop/?collection=unisex#collection" aria-label="Shop Unisex perfumes"><img src="/assets/collections-square/unisex-collection-vertical.webp" alt="Unisex perfume collection" loading="eager"></a></section>\n'''
          if marker not in s:
              raise SystemExit('shop collection marker missing')
          s=s.replace(marker,block+marker,1)
          responsive='''<style id="perfume-collection-responsive-fix">\n.perfume-collection-banners{box-sizing:border-box;width:100%;max-width:1420px;margin:0 auto;padding:48px 5% 22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;overflow:hidden}.perfume-collection-banner{display:block;position:relative;width:100%;min-width:0;overflow:hidden;background:#eee8de;aspect-ratio:941/1672}.perfume-collection-banner img{display:block;width:100%;height:100%;max-width:100%;object-fit:cover;object-position:center;transition:transform .6s ease}.perfume-collection-banner:hover img{transform:scale(1.02)}\n@media(max-width:850px){.perfume-collection-banners{display:flex;width:100%;max-width:none;gap:12px;padding:24px 16px 16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none}.perfume-collection-banners::-webkit-scrollbar{display:none}.perfume-collection-banner{flex:0 0 min(78vw,390px);width:min(78vw,390px);aspect-ratio:941/1672;scroll-snap-align:start}.perfume-collection-banner img{width:100%;height:100%;object-fit:cover;object-position:center}}\n@media(max-width:480px){.perfume-collection-banners{padding-left:14px;padding-right:14px;gap:10px}.perfume-collection-banner{flex-basis:78vw;width:78vw;aspect-ratio:941/1672}}\n</style>'''
          s=s.replace('</head>',responsive+'</head>',1)
          shop.write_text(s)
          PY
      - name: Commit corrected responsive banners
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html dist/shop/index.html
          git commit -m "fix: use exact 941x1672 perfume collection ratio"
          git push
