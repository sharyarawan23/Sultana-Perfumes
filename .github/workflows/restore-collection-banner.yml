name: Restore perfume vertical collection banners
on:
  push:
    paths:
      - '.github/workflows/restore-collection-banner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move collection banners to perfume shop
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove the mistakenly-added collection showcase from Home.
          home=Path('dist/index.html')
          s=home.read_text()
          s=re.sub(r'<section class="section-shell" id="collection-showcase".*?</section>\s*', '', s, count=1, flags=re.S)
          home.write_text(s)

          # Restore the vertical Men / Women / Unisex banners inside Perfumes/Shop.
          shop=Path('dist/shop/index.html')
          s=shop.read_text()
          # Remove an older copy first so this remains idempotent.
          s=re.sub(r'<section class="perfume-collection-banners".*?</section>\s*', '', s, count=1, flags=re.S)
          marker='<section class="shop-section section-shell" id="collection">'
          block='''<section class="perfume-collection-banners" aria-label="Perfume collections"><a class="perfume-collection-banner" href="/shop/?collection=men#collection" aria-label="Shop Men perfumes"><img src="/assets/collections/men-hd.webp" alt="Men perfume collection" loading="eager"></a><a class="perfume-collection-banner" href="/shop/?collection=women#collection" aria-label="Shop Women perfumes"><img src="/assets/collections/women-hd.webp" alt="Women perfume collection" loading="eager"></a><a class="perfume-collection-banner" href="/shop/?collection=unisex#collection" aria-label="Shop Unisex perfumes"><img src="/assets/collections/unisex-hd.webp" alt="Unisex perfume collection" loading="eager"></a></section>\n'''
          if marker not in s:
              raise SystemExit('shop collection marker missing')
          s=s.replace(marker,block+marker,1)
          shop.write_text(s)

          css=Path('dist/style.css')
          c=css.read_text()
          if '/* perfume-vertical-collection-banners */' not in c:
              c += '''\n/* perfume-vertical-collection-banners */\n.perfume-collection-banners{max-width:1420px;margin:0 auto;padding:48px 5% 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.perfume-collection-banner{display:block;position:relative;overflow:hidden;background:#eee8de;aspect-ratio:3/4}.perfume-collection-banner img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}.perfume-collection-banner:hover img{transform:scale(1.025)}@media(max-width:700px){.perfume-collection-banners{display:flex;overflow-x:auto;gap:12px;padding:28px 5% 12px;scroll-snap-type:x mandatory}.perfume-collection-banner{flex:0 0 78%;scroll-snap-align:start}}\n'''
              css.write_text(c)
          PY
      - name: Commit corrected banner placement
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html dist/shop/index.html dist/style.css
          git commit -m "fix: restore vertical perfume collection banners in shop only"
          git push
