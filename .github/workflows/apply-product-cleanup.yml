name: Apply product metadata cleanup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-product-cleanup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cleanup script to all pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('dist').rglob('*.html'):
              t=p.read_text()
              tag='<script src="/product-cleanup.js?v=20260930" defer></script>'
              if '/product-cleanup.js' not in t:
                  t=t.replace('</body>',tag+'</body>',1)
                  p.write_text(t)
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m 'fix: clean product metadata on all pages'
          git push
