name: Sync product page navigation
on:
  push:
    branches: [main]
    paths:
      - 'dist/product-page-fix.js'
      - '.github/workflows/sync-product-pages.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject product page fix
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=False
          for p in Path('dist/products').glob('*/index.html'):
              s=p.read_text()
              tag='<script src="/product-page-fix.js" defer></script>'
              if tag not in s:
                  s=s.replace('</body>', tag+'</body>')
                  p.write_text(s)
                  changed=True
          print('updated' if changed else 'already synced')
          PY
      - name: Commit generated product pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/products/*/index.html
          git diff --cached --quiet || git commit -m 'Apply back navigation to all product pages'
          git push
