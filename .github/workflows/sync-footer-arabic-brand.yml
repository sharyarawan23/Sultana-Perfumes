name: Remove duplicate footer Arabic brand name
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-footer-arabic-brand.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate Arabic brand name beside footer logo on every page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('dist')
          for p in root.rglob('*.html'):
            t = p.read_text()
            # Remove only the duplicate Arabic line immediately associated with the footer logo.
            # Keep the existing lower .footer-arabic line unchanged.
            nt = re.sub(
              r'<p\s+class="footer-arabic-brand"\s+lang="ar"\s+dir="rtl">سلطانة للعطور</p>',
              '',
              t
            )
            if nt != t:
              p.write_text(nt)

          css = root / 'style.css'
          if css.exists():
            s = css.read_text()
            s = re.sub(
              r'\n*/\* Footer Arabic brand name \*/\n'
              r'\.footer-arabic-brand\{[^\n]*\}\n'
              r'html\[dir="rtl"\] \.footer-arabic-brand\{[^\n]*\}\n'
              r'@media\(max-width:700px\)\{\.footer-arabic-brand\{[^\n]*\}\}\n?',
              '\n',
              s
            )
            css.write_text(s)
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m 'fix: remove duplicate Arabic footer brand sitewide'
          git push
