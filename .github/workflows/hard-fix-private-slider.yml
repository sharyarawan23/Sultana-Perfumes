name: Hard Fix Private Slider
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hard-fix-private-slider.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Private Collection independent from app runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dist/oud-bakhoor/index.html')
          s=p.read_text()
          old='<div id="signature-products" class="product-grid signature-grid"></div>'
          cards='''<div id="private-static-track" class="product-grid signature-grid">
          <article class="product-card"><div class="product-image"><a class="product-photo-link" href="/products/sultana-oud/"><img src="/assets/new-products/sultana-oud-hd.webp" alt="Sultana Oud"></a></div><h3><a href="/products/sultana-oud/">Sultana Oud</a></h3><p class="price">QAR 350</p></article>
          <article class="product-card"><div class="product-image"><a class="product-photo-link" href="/products/royal-bukhoor/"><img src="/assets/new-products/royal-bukhoor-hd.webp" alt="Royal Bukhoor"></a></div><h3><a href="/products/royal-bukhoor/">Royal Bukhoor</a></h3><p class="price">QAR 350</p></article>
          <article class="product-card"><div class="product-image"><a class="product-photo-link" href="/products/amber-night/"><img src="/assets/new-products/amber-night-hd.webp" alt="Amber Night"></a></div><h3><a href="/products/amber-night/">Amber Night</a></h3><p class="price">QAR 350</p></article>
          <article class="product-card"><div class="product-image"><a class="product-photo-link" href="/products/oud-collection-set/"><img src="/assets/new-products/oud-collection-set.webp" alt="Oud Collection Set"></a></div><h3><a href="/products/oud-collection-set/">Oud Collection Set</a></h3><p class="price">QAR 1100</p></article>
          <article class="product-card"><div class="product-image"><a class="product-photo-link" href="/?type=burner#collection"><img src="/assets/new-products/bakhoor-burner-hd.webp" alt="Bakhoor Holder"></a></div><h3><a href="/?type=burner#collection">Bakhoor Holder</a></h3></article>
          </div>'''
          if old not in s: raise SystemExit('old signature track not found')
          s=s.replace(old,cards,1)
          s=s.replace('#signature-products{','#private-static-track{').replace('#signature-products::-webkit-scrollbar','#private-static-track::-webkit-scrollbar').replace('#signature-products>.product-card','#private-static-track>.product-card')
          s=s.replace("const g=document.getElementById('signature-products')","const g=document.getElementById('private-static-track')")
          p.write_text(s)
          PY
          rm .github/workflows/hard-fix-private-slider.yml
          git config user.name 'Sultana Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Hard-fix Private Collection slider independent of runtime'
          git push
