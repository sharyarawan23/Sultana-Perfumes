name: Add free delivery moving announcement
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-free-delivery-marquee.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put English announcement messages before Arabic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/currency.js')
          s=p.read_text()
          old='''const copy='<span class="announcement-copy"><span class="en">FREE DELIVERY</span><span class="ar" lang="ar" dir="rtl">توصيل مجاني</span><span class="dot">✦</span><span class="en">SULTANA PERFUMES</span><span class="ar" lang="ar" dir="rtl">عطور سلطانة</span><span class="dot">✦</span><span class="en">A SCENT FOR EVERY MOMENT</span><span class="ar" lang="ar" dir="rtl">عطر لكل لحظة</span><span class="dot">✦</span><span class="en">QATAR</span><span class="ar" lang="ar" dir="rtl">قطر</span><span class="dot">✦</span></span>';'''
          new='''const copy='<span class="announcement-copy"><span class="en">FREE DELIVERY</span><span class="dot">✦</span><span class="en">SULTANA PERFUMES</span><span class="dot">✦</span><span class="en">A SCENT FOR EVERY MOMENT</span><span class="dot">✦</span><span class="en">QATAR</span><span class="dot">✦</span><span class="ar" lang="ar" dir="rtl">توصيل مجاني</span><span class="dot">✦</span><span class="ar" lang="ar" dir="rtl">عطور سلطانة</span><span class="dot">✦</span><span class="ar" lang="ar" dir="rtl">عطر لكل لحظة</span><span class="dot">✦</span><span class="ar" lang="ar" dir="rtl">قطر</span><span class="dot">✦</span></span>';'''
          if old not in s:
              raise SystemExit('Expected announcement block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/currency.js
          git commit -m 'fix: order announcement English then Arabic'
          git push
