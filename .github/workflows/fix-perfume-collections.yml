name: Fix exact perfume collections
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-perfume-collections.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set exact Women Men Unisex perfume collections and rebuild storefront
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, sys
          pp=Path('data/products.json')
          cp=Path('data/collections.json')
          products=json.loads(pp.read_text())
          collections=json.loads(cp.read_text())
          exact={
            'Women':['ayla','one-kiss','sigma','vanilla-elixir','oud-rose'],
            'Men':['lafiesta','portofino','amicare'],
            'Unisex':['patchouli','casa-blanca','tobacco','lenden','ajwan'],
          }
          collections.update(exact)
          owner={pid:label for label,ids in exact.items() for pid in ids}
          for p in products:
            if p['id'] in owner:
              p['collection']=owner[p['id']]
          pp.write_text(json.dumps(products,ensure_ascii=False,indent=2)+'\n')
          cp.write_text(json.dumps(collections,ensure_ascii=False,indent=2)+'\n')
          subprocess.run([sys.executable,'scripts/generate-product-pages.py'],check=True)
          PY
      - name: Commit rebuilt storefront
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data dist
          git commit -m 'fix: apply exact perfume collection membership sitewide'
          git push
