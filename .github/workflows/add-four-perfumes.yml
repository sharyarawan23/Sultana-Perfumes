name: Add four perfume products
# retry after storefront asset validation update

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-four-perfumes.yml'

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Lafiesta, One Kiss, Tobacco and update Sigma
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, sys

          products_path=Path('data/products.json')
          collections_path=Path('data/collections.json')
          products=json.loads(products_path.read_text())
          collections=json.loads(collections_path.read_text())

          entries=[
            {
              'id':'lafiesta','name':'Lafiesta','price':375,'currency':'QAR','type':'Perfume','size':'100 ml','collection':'Men',
              'image':'assets/new-products/lafiesta.svg','page':'products/lafiesta/',
              'description':'Discover Lafiesta from the Sultana perfume collection, presented in a signature gold-capped bottle.',
              'name_ar':'لافيستا','description_ar':'اكتشف لافيستا من مجموعة عطور سلطانة، في زجاجة مميزة بغطاء ذهبي.',
              'description_title':'','description_title_ar':'','tagline':'','tagline_ar':''
            },
            {
              'id':'one-kiss','name':'One Kiss','price':375,'currency':'QAR','type':'Perfume','size':'100 ml','collection':'Women',
              'image':'assets/new-products/one-kiss.svg','page':'products/one-kiss/',
              'description':'Discover One Kiss from the Sultana perfume collection, presented in a signature gold-capped bottle.',
              'name_ar':'ون كيس','description_ar':'اكتشف ون كيس من مجموعة عطور سلطانة، في زجاجة مميزة بغطاء ذهبي.',
              'description_title':'','description_title_ar':'','tagline':'','tagline_ar':''
            },
            {
              'id':'tobacco','name':'Tobacco','price':375,'currency':'QAR','type':'Perfume','size':'100 ml','collection':'Unisex',
              'image':'assets/new-products/tobacco.svg','page':'products/tobacco/',
              'description':'Discover Tobacco from the Sultana perfume collection, presented in a signature gold-capped bottle.',
              'name_ar':'توباكو','description_ar':'اكتشف توباكو من مجموعة عطور سلطانة، في زجاجة مميزة بغطاء ذهبي.',
              'description_title':'','description_title_ar':'','tagline':'','tagline_ar':''
            },
            {
              'id':'sigma','name':'Sigma','price':375,'currency':'QAR','type':'Perfume','size':'100 ml','collection':'Women',
              'image':'assets/new-products/sigma.svg','page':'products/sigma/',
              'description':'Discover Sigma from the Sultana perfume collection, presented in a signature gold-capped bottle.',
              'name_ar':'سيغما','description_ar':'اكتشف سيغما من مجموعة عطور سلطانة، في زجاجة مميزة بغطاء ذهبي.',
              'description_title':'','description_title_ar':'','tagline':'','tagline_ar':''
            }
          ]

          by_id={p['id']:i for i,p in enumerate(products)}
          for item in entries:
              if item['id'] in by_id:
                  products[by_id[item['id']]]=item
              else:
                  products.append(item)
                  by_id[item['id']]=len(products)-1
              for members in collections.values():
                  while item['id'] in members:
                      members.remove(item['id'])
              collections[item['collection']].append(item['id'])

          products_path.write_text(json.dumps(products,ensure_ascii=False,indent=2)+'\n')
          collections_path.write_text(json.dumps(collections,ensure_ascii=False,indent=2)+'\n')

          index=Path('dist/index.html')
          html=index.read_text()
          if '<link rel="canonical"' not in html:
              html=html.replace('</head>','<link rel="canonical" href="https://sultana-perfumes.vercel.app/">\n</head>',1)
              index.write_text(html)

          subprocess.run([sys.executable,'scripts/generate-product-pages.py'],check=True)
          PY
      - name: Commit generated storefront
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data dist
          git commit -m 'feat: add Lafiesta One Kiss Tobacco and update Sigma'
          git push
