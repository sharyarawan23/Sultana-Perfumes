name: Fix global Sultana header
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-global-header.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force Arabic navigation on Arabic pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('dist')
          arabic_links='''<a href="/ar/">الرئيسية</a><a href="/ar/shop/?collection=perfume#collection">العطور</a><a href="/ar/room-sprays/">البخاخات الفاخرة</a><a href="/ar/oud-bakhoor/">العود والبخور</a><a href="/ar/b2b/">قطاع الأعمال</a><a href="/ar/our-story/">قصتنا</a><a href="/ar/contact/">اتصل بنا</a>'''
          arabic_desktop=f'''<nav class="desktop-luxury-nav arabic-nav" aria-label="القائمة الرئيسية" dir="rtl">{arabic_links}</nav>'''
          arabic_main=f'''<nav id="main-navigation" aria-label="القائمة الرئيسية" dir="rtl">{arabic_links}</nav>'''
          for p in root.rglob('*.html'):
            rel=p.relative_to(root)
            if 'ar' not in rel.parts:
              continue
            t=p.read_text()
            # Translate the original navigation too, because some legacy CSS/pages expose it on desktop.
            t=re.sub(r'<nav id="main-navigation".*?</nav>', arabic_main, t, count=1, flags=re.S)
            # Translate/rebuild the dedicated desktop navigation.
            if re.search(r'<nav class="desktop-luxury-nav[^\"]*".*?</nav>',t,re.S):
              t=re.sub(r'<nav class="desktop-luxury-nav[^\"]*".*?</nav>',arabic_desktop,t,flags=re.S)
            else:
              end=t.find('</header>')
              if end!=-1: t=t[:end]+arabic_desktop+t[end:]
            # Strong fallback: whichever nav layer becomes visible must be fully Arabic.
            marker='<style id="arabic-nav-force">@media(min-width:851px){header>#main-navigation{display:none!important}.desktop-luxury-nav.arabic-nav{display:flex!important;direction:rtl!important}.desktop-luxury-nav.arabic-nav a{font-size:13px!important;text-transform:none!important;letter-spacing:0!important}}</style>'
            t=re.sub(r'<style id="arabic-nav-force">.*?</style>','',t,flags=re.S)
            t=t.replace('</head>',marker+'</head>',1)
            p.write_text(t)
          PY
      - name: Commit Arabic navigation fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m 'fix: translate both Arabic navigation layers'
          git push
