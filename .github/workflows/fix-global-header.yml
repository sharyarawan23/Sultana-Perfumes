name: Fix global Sultana header
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-global-header.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild header on every page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('dist')
          nav='''<nav class="desktop-luxury-nav" aria-label="Main navigation"><a href="/">Home</a><a href="/shop/?collection=perfume#collection">Perfumes</a><a href="/room-sprays/">Luxury Spray</a><a href="/oud-bakhoor/">Oud &amp; Bakhoor</a><a href="/b2b/">B2B</a><a href="/our-story/">Our Story</a><a href="/contact/">Contact</a></nav>'''
          left='''<div class="desktop-header-left"><span>Qatar</span><span class="sep">|</span><select id="desktop-currency-select" aria-label="Currency"><option value="QAR">🇶🇦 QAR</option><option value="USD">🇺🇸 USD</option><option value="EUR">🇪🇺 EUR</option><option value="GBP">🇬🇧 GBP</option><option value="AED">🇦🇪 AED</option><option value="SAR">🇸🇦 SAR</option><option value="KWD">🇰🇼 KWD</option><option value="BHD">🇧🇭 BHD</option><option value="OMR">🇴🇲 OMR</option><option value="TND">🇹🇳 TND</option><option value="MAD">🇲🇦 MAD</option></select><span class="sep">|</span><a class="desktop-language-switch" href="/ar/" lang="ar" hreflang="ar">العربية</a></div>'''
          css='''<style id="global-luxury-header">@media(min-width:851px){header{height:160px!important;min-height:160px!important;padding:0 5%!important;display:grid!important;grid-template-columns:1fr auto 1fr!important;grid-template-rows:112px 48px!important;gap:0 24px!important;align-items:center!important;background:#fffdfa!important;position:relative!important;overflow:visible!important}header>.brand{grid-column:2!important;grid-row:1!important;justify-self:center!important;align-self:center!important;position:static!important;transform:none!important;width:92px!important;height:102px!important;margin:0!important}header>.brand img{width:100%!important;height:100%!important;object-fit:contain!important}header>.header-actions{grid-column:3!important;grid-row:1!important;justify-self:end!important;display:flex!important;visibility:visible!important;opacity:1!important;align-items:center!important;gap:16px!important;position:static!important;transform:none!important}header>.header-actions #search-open,header>.header-actions #bag-open{display:inline-flex!important;visibility:visible!important;opacity:1!important}header>.header-actions .currency-select,header>.header-actions .language-switch{display:none!important}header>#main-navigation,header>.menu-toggle{display:none!important}.desktop-header-left{grid-column:1!important;grid-row:1!important;justify-self:start!important;display:flex!important;visibility:visible!important;opacity:1!important;align-items:center!important;gap:11px!important;font-size:12px!important;white-space:nowrap!important}.desktop-header-left select,.desktop-header-left a{border:0!important;background:transparent!important;padding:4px 0!important;font-size:12px!important;color:#17130f!important;text-decoration:none!important}.desktop-header-left .sep{color:#9b9286!important}.desktop-luxury-nav{grid-column:1/-1!important;grid-row:2!important;display:flex!important;visibility:visible!important;opacity:1!important;position:relative!important;transform:none!important;width:100%!important;height:48px!important;align-items:center!important;justify-content:center!important;gap:clamp(25px,3vw,52px)!important;background:#fffdfa!important;z-index:100!important}.desktop-luxury-nav a{display:inline-flex!important;visibility:visible!important;opacity:1!important;align-items:center!important;color:#17130f!important;font:500 11px/48px var(--sans,Arial,sans-serif)!important;letter-spacing:.35px!important;text-transform:uppercase!important;white-space:nowrap!important;text-decoration:none!important}}@media(max-width:850px){.desktop-luxury-nav,.desktop-header-left{display:none!important}}</style>'''
          for p in root.rglob('*.html'):
            t=p.read_text()
            t=re.sub(r'<nav class="desktop-luxury-nav".*?</nav>','',t,flags=re.S)
            t=re.sub(r'<div class="desktop-header-left".*?</div>','',t,flags=re.S)
            t=re.sub(r'<style id="global-luxury-header">.*?</style>','',t,flags=re.S)
            end=t.find('</header>')
            if end!=-1:
              t=t[:end]+left+nav+t[end:]
            t=t.replace('</head>',css+'</head>',1)
            script='<script src="/currency.js?v=header-20260929-1" defer></script>'
            if re.search(r'<script src="/currency\.js(?:\?[^\"]*)?" defer></script>',t):
              t=re.sub(r'<script src="/currency\.js(?:\?[^\"]*)?" defer></script>',script,t)
            else:
              t=t.replace('</body>',script+'</body>',1)
            p.write_text(t)
          PY
      - name: Commit rebuilt headers
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m 'fix: render complete desktop header on all pages'
          git push
