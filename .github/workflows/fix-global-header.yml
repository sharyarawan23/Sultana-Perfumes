name: Fix global Sultana header
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-global-header.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild header on every page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('dist')
          nav_en='''<nav class="desktop-luxury-nav" aria-label="Main navigation"><a href="/">Home</a><a href="/shop/?collection=perfume#collection">Perfumes</a><a href="/room-sprays/">Luxury Spray</a><a href="/oud-bakhoor/">Oud &amp; Bakhoor</a><a href="/b2b/">B2B</a><a href="/our-story/">Our Story</a><a href="/contact/">Contact</a></nav>'''
          nav_ar='''<nav class="desktop-luxury-nav arabic-nav" aria-label="القائمة الرئيسية" dir="rtl"><a href="/ar/">الرئيسية</a><a href="/ar/shop/?collection=perfume#collection">العطور</a><a href="/ar/room-sprays/">البخاخات الفاخرة</a><a href="/ar/oud-bakhoor/">العود والبخور</a><a href="/ar/b2b/">قطاع الأعمال</a><a href="/ar/our-story/">قصتنا</a><a href="/ar/contact/">اتصل بنا</a></nav>'''
          left_en='''<div class="desktop-header-left"><select id="desktop-currency-select" aria-label="Currency"><option value="QAR">🇶🇦 QAR</option><option value="USD">🇺🇸 USD</option><option value="EUR">🇪🇺 EUR</option><option value="GBP">🇬🇧 GBP</option><option value="AED">🇦🇪 AED</option><option value="SAR">🇸🇦 SAR</option><option value="KWD">🇰🇼 KWD</option><option value="BHD">🇧🇭 BHD</option><option value="OMR">🇴🇲 OMR</option><option value="TND">🇹🇳 TND</option><option value="MAD">🇲🇦 MAD</option></select><span class="sep">|</span><a class="desktop-language-switch" href="/ar/" lang="ar" hreflang="ar">العربية</a></div>'''
          left_ar='''<div class="desktop-header-left"><select id="desktop-currency-select" aria-label="العملة"><option value="QAR">🇶🇦 QAR</option><option value="USD">🇺🇸 USD</option><option value="EUR">🇪🇺 EUR</option><option value="GBP">🇬🇧 GBP</option><option value="AED">🇦🇪 AED</option><option value="SAR">🇸🇦 SAR</option><option value="KWD">🇰🇼 KWD</option><option value="BHD">🇧🇭 BHD</option><option value="OMR">🇴🇲 OMR</option><option value="TND">🇹🇳 TND</option><option value="MAD">🇲🇦 MAD</option></select><span class="sep">|</span><a class="desktop-language-switch" href="/" lang="en" hreflang="en">English</a></div>'''
          search_svg='''<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>'''
          bag_svg='''<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5.5 8.5h13l1 12h-15l1-12Z"/><path d="M9 9V6.5a3 3 0 0 1 6 0V9"/></svg>'''
          actions=f'''<div class="header-actions"><button class="icon-button" id="search-open" aria-label="Search fragrances">{search_svg}</button><button class="icon-button" id="bag-open" aria-label="Open shopping bag">{bag_svg}<span class="header-bag-count" aria-hidden="true">0</span></button></div>'''
          css='''<style id="global-luxury-header">@media(min-width:851px){header{height:160px!important;min-height:160px!important;padding:0 5%!important;display:grid!important;grid-template-columns:1fr auto 1fr!important;grid-template-rows:112px 48px!important;gap:0 24px!important;align-items:center!important;background:#fffdfa!important;position:relative!important;overflow:visible!important}header>.brand{grid-column:2!important;grid-row:1!important;justify-self:center!important;align-self:center!important;position:static!important;transform:none!important;width:92px!important;height:102px!important;margin:0!important}header>.brand img{width:100%!important;height:100%!important;object-fit:contain!important}header>.header-actions{grid-column:3!important;grid-row:1!important;justify-self:end!important;display:flex!important;visibility:visible!important;opacity:1!important;align-items:center!important;gap:18px!important;position:static!important;transform:none!important;z-index:101!important}header>.header-actions .icon-button{display:inline-flex!important;visibility:visible!important;opacity:1!important;position:relative!important;width:34px!important;height:34px!important;align-items:center!important;justify-content:center!important;border:0!important;background:transparent!important;color:#17130f!important;padding:5px!important;cursor:pointer!important}header>.header-actions svg{display:block!important;width:24px!important;height:24px!important}.header-bag-count{position:absolute!important;top:0!important;right:-3px!important;min-width:15px!important;height:15px!important;padding:0 3px!important;background:#17130f!important;color:#fff!important;font:10px/15px Arial,sans-serif!important;text-align:center!important}header>#main-navigation,header>.menu-toggle{display:none!important}.desktop-header-left{grid-column:1!important;grid-row:1!important;justify-self:start!important;display:flex!important;visibility:visible!important;opacity:1!important;align-items:center!important;gap:11px!important;font-size:12px!important;white-space:nowrap!important}.desktop-header-left select,.desktop-header-left a{border:0!important;background:transparent!important;padding:4px 0!important;font-size:12px!important;color:#17130f!important;text-decoration:none!important}.desktop-header-left .sep{color:#9b9286!important}.desktop-luxury-nav{grid-column:1/-1!important;grid-row:2!important;display:flex!important;visibility:visible!important;opacity:1!important;position:relative!important;transform:none!important;width:100%!important;height:48px!important;align-items:center!important;justify-content:center!important;gap:clamp(25px,3vw,52px)!important;background:#fffdfa!important;z-index:100!important}.desktop-luxury-nav a{display:inline-flex!important;visibility:visible!important;opacity:1!important;align-items:center!important;color:#17130f!important;font:500 11px/48px var(--sans,Arial,sans-serif)!important;letter-spacing:.35px!important;text-transform:uppercase!important;white-space:nowrap!important;text-decoration:none!important}.desktop-luxury-nav.arabic-nav a{font-size:13px!important;text-transform:none!important;letter-spacing:0!important}}@media(max-width:850px){.desktop-luxury-nav,.desktop-header-left{display:none!important}}</style>'''
          for p in root.rglob('*.html'):
            t=p.read_text()
            t=re.sub(r'<nav class="desktop-luxury-nav[^\"]*".*?</nav>','',t,flags=re.S)
            t=re.sub(r'<div class="desktop-header-left".*?</div>','',t,flags=re.S)
            t=re.sub(r'<div class="header-actions".*?</div>','',t,flags=re.S)
            t=re.sub(r'<style id="global-luxury-header">.*?</style>','',t,flags=re.S)
            is_ar = p == root/'ar'/'index.html' or 'ar' in p.relative_to(root).parts
            nav = nav_ar if is_ar else nav_en
            left = left_ar if is_ar else left_en
            end=t.find('</header>')
            if end!=-1:
              t=t[:end]+left+actions+nav+t[end:]
            t=t.replace('</head>',css+'</head>',1)
            script='<script src="/currency.js?v=header-20260930-ar" defer></script>'
            if re.search(r'<script src="/currency\.js(?:\?[^\"]*)?" defer></script>',t):
              t=re.sub(r'<script src="/currency\.js(?:\?[^\"]*)?" defer></script>',script,t)
            else:
              t=t.replace('</body>',script+'</body>',1)
            p.write_text(t)
          PY
      - name: Commit rebuilt headers
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m 'fix: fully localize Arabic header menu'
          git push
