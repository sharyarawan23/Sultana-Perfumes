            'oud-rose': {
              'description_title':'',
              'description':'A luxurious Oriental fragrance with an authentic Gulf character — warm, elegant, and captivating. Oud Rose evokes the enchanting feeling of being freshly perfumed with the finest oud and incense.\n\nThe richness of precious oud blends beautifully with the softness of rose, creating a sophisticated Oriental harmony. Warm and distinctive, it leaves an elegant and captivating trail that lingers beautifully on the skin.',
              'description_title_ar':'',
              'description_ar':'عطر شرقي فاخر بطابع خليجي أصيل، دافئ وأنيق وآسر، يمنح إحساساً بالتعطر بأجود أنواع العود والبخور.\n\nيمتزج غنى العود الثمين مع نعومة الورد بتناغم شرقي راقٍ، ليمنح حضوراً مميزاً ودافئاً ويترك أثراً أنيقاً وجذاباً يدوم على البشرة.',
              'tagline':'Oud Rose — The timeless luxury of oud wrapped in the delicate beauty of Oriental rose.',
              'tagline_ar':'عود روز — فخامة العود الخالدة بلمسة رقيقة من الورد الشرقي.'}
