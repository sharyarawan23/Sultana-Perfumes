          found=set()
          for item in data:
            if item.get('id') in copy:
              item.update(copy[item['id']]); found.add(item['id'])
          missing=set(copy)-found
          if missing: raise SystemExit(f'Missing products: {sorted(missing)}')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Regenerate storefront product pages
        run: python3 scripts/generate-product-pages.py
      - name: Commit exact supplied descriptions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/products.csv dist/app.js dist/products
          git diff --cached --quiet || git commit -m 'Use supplied perfume descriptions exactly'
          git push
