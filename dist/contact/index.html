<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — Sultana Perfumes</title><link rel="stylesheet" href="/style.css"><style>.contact-page{background:#fffdf9;padding:72px clamp(20px,7vw,110px) 90px}.contact-wrap{max-width:1200px;margin:auto;display:grid;grid-template-columns:.8fr 1.2fr;gap:80px}.contact-kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#9b6e32;margin:0 0 14px}.contact-info h1{font-family:serif;font-size:clamp(46px,6vw,78px);font-weight:400;line-height:1;margin:0 0 25px}.contact-copy{max-width:420px;line-height:1.8;color:#625c55}.contact-detail{margin-top:42px;padding-top:24px;border-top:1px solid #ded5c8}.contact-detail span{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8c8175;margin-bottom:8px}.contact-detail strong{font-size:18px;font-weight:400}.contact-form{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}.field label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#655d54}.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid #d8cdbd;background:#fff;padding:15px 16px;font:inherit;color:#17130f;outline:none}.field input:focus,.field textarea:focus{border-color:#9b6e32}.field textarea{min-height:170px;resize:vertical}.whatsapp-submit{grid-column:1/-1;border:0;background:#17130f;color:#fff;padding:17px 25px;font:inherit;font-size:12px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:transform .2s ease,background .2s ease}.whatsapp-submit:hover{background:#8d632d;transform:translateY(-2px)}@media(max-width:800px){.contact-page{padding-top:45px}.contact-wrap{grid-template-columns:1fr;gap:45px}.contact-form{grid-template-columns:1fr}.field.full,.whatsapp-submit{grid-column:1}}</style></head><body><div class="announcement"><span>SULTANA PERFUMES</span><span>A SCENT FOR EVERY MOMENT</span><span>QATAR · QAR</span></div><header><button class="icon-button menu-toggle" id="menu-open" aria-controls="main-navigation" aria-expanded="false" aria-label="Open navigation">☰</button><nav id="main-navigation" aria-label="Main navigation"></nav><a class="brand" href="/"><img src="/assets/brand/sultana-logo.png" alt="Sultana Perfumes"></a><div class="header-actions"><a class="language-switch" href="/ar/" lang="ar">العربية</a></div></header><main class="contact-page"><div class="contact-wrap"><section class="contact-info"><p class="contact-kicker">Contact Sultana</p><h1>We’d love to hear from you.</h1><p class="contact-copy">For product enquiries, gifting, orders or general assistance, send us a message directly on WhatsApp.</p><div class="contact-detail"><span>Address</span><strong>Doha, Qatar</strong></div><div class="contact-detail"><span>WhatsApp</span><strong>+974 3390 1711</strong></div></section><form class="contact-form" id="whatsapp-contact-form"><div class="field"><label for="name">Name</label><input id="name" name="name" type="text" required autocomplete="name"></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" required autocomplete="tel"></div><div class="field full"><label for="subject">Subject</label><input id="subject" name="subject" type="text" required></div><div class="field full"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div><button class="whatsapp-submit" type="submit">Send via WhatsApp →</button></form></div></main><script>document.getElementById('whatsapp-contact-form').addEventListener('submit',function(e){e.preventDefault();const data=new FormData(this);const text=['Hello Sultana Perfumes,','',`Name: ${data.get('name')}`,`Phone: ${data.get('phone')}`,`Subject: ${data.get('subject')}`,'',`Message: ${data.get('message')}`].join('\n');window.open('https://wa.me/97433901711?text='+encodeURIComponent(text),'_blank','noopener,noreferrer');});</script><script src="/app.js" defer></script><script src="/site-structure-menu.js" defer></script></body></html>
