<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="اكتشف عطور سلطانة الفاخرة في قطر."><title>جميع العطور — سلطانة للعطور</title><link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png"><link rel="stylesheet" href="/style.css"><style>.perfume-category-card{position:relative;display:block;overflow:hidden}.perfume-category-card img{transition:transform .45s ease}.perfume-category-card:hover img{transform:scale(1.025)}.perfume-category-shop{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:2;display:inline-flex;align-items:center;gap:12px;padding:12px 25px;background:rgba(244,211,150,.94);color:#17120d;font-size:13px;letter-spacing:.08em;white-space:nowrap;box-shadow:0 5px 18px rgba(0,0,0,.12)}@media(max-width:700px){.perfume-category-shop{bottom:10px;padding:9px 14px;font-size:10px}}</style></head><body><a class="skip-link" href="#main-content">انتقل إلى المحتوى</a><div class="announcement"><span>سلطانة للعطور</span><span>عطر لكل لحظة</span><span>قطر · ر.ق</span></div><header><button class="icon-button menu-toggle" id="menu-open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button><nav id="main-navigation"></nav><a class="brand" href="/ar/"><img src="/assets/brand/sultana-logo.png" alt="سلطانة للعطور"></a><div class="header-actions"><button class="icon-button" id="search-open"></button><a class="language-switch" id="language-switch" href="/shop/" lang="en">English</a><button class="icon-button" id="bag-open"></button></div></header><main id="main-content"><section id="perfume-collection-banner" aria-label="مجموعة العطور" style="display:none;width:100%;aspect-ratio:3/1;overflow:hidden;background:#eadbc0"><a class="perfume-banner-link" href="#perfume-category-cards"><img src="/assets/WhatsApp%20Image%202026-09-21%20at%2016.11.22.jpeg" alt="مجموعة عطور سلطانة" style="width:100%;height:100%;object-fit:cover"></a></section><section id="perfume-category-cards" aria-label="مجموعات العطور" style="display:none;padding:48px clamp(16px,5.3vw,82px) 12px;background:#fffdf9"><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1400px;margin:0 auto"><a class="perfume-category-card" href="/ar/shop/?collection=women#collection"><img src="/assets/collection-notes/women-hd.webp" alt="للنساء" style="display:block;width:100%;height:auto;aspect-ratio:307/204;object-fit:cover"><span class="perfume-category-shop">تسوق الآن ←</span></a><a class="perfume-category-card" href="/ar/shop/?collection=men#collection"><img src="/assets/collection-notes/men-hd.webp" alt="للرجال" style="display:block;width:100%;height:auto;aspect-ratio:307/204;object-fit:cover"><span class="perfume-category-shop">تسوق الآن ←</span></a><a class="perfume-category-card" href="/ar/shop/?collection=unisex#collection"><img src="/assets/collection-notes/unisex-hd.webp" alt="للجنسين" style="display:block;width:100%;height:auto;aspect-ratio:307/204;object-fit:cover"><span class="perfume-category-shop">تسوق الآن ←</span></a></div></section><section class="shop-section section-shell" id="collection"><div class="section-heading reveal"><div><p class="eyebrow">جميع العطور</p><h1 id="catalog-title">اكتشف المجموعة.</h1></div><span id="catalog-count" class="collection-count">٢٨ عطراً. سلطانة واحدة.</span></div><p id="results-count" class="visually-hidden" role="status"></p><div id="products" class="product-grid"></div></section><section id="perfume-bottom-banner" aria-label="أيلا" style="display:none;width:100%;aspect-ratio:3/1;overflow:hidden"><a class="perfume-banner-link" href="/ar/products/ayla/"><img src="/assets/WhatsApp%20Image%202026-09-21%20at%2016.11.33.jpeg" alt="أيلا" loading="lazy" style="width:100%;height:100%;object-fit:cover"></a></section></main><footer><div class="footer-main"><div><a href="/ar/" class="brand footer-brand"><img src="/assets/brand/sultana-logo.png" alt="سلطانة للعطور"></a><p>عطر. إحساس. يشبهك وحدك.</p></div></div><div class="footer-bottom"><span>© ٢٠٢٦ سلطانة للعطور</span><span>قطر · ر.ق</span></div></footer><dialog id="search-dialog"><button class="close" data-close>×</button><h2>اعثر على عطرك</h2><input id="search" type="search"><div id="search-results" class="search-results"></div></dialog><dialog id="bag-dialog" class="bag-dialog"><button class="close" data-close>×</button><h2>حقيبتك <span id="bag-count">0</span></h2><div id="bag-items"></div></dialog><div id="toast"></div><script src="/app.js" defer></script><script src="/ar-site-sync.js" defer></script><script>if(new URLSearchParams(location.search).get('collection')==='perfume'){document.getElementById('perfume-collection-banner').style.display='block';document.getElementById('perfume-category-cards').style.display='block';document.getElementById('perfume-bottom-banner').style.display='block';}document.addEventListener('DOMContentLoaded',()=>{collections.women.splice(0,collections.women.length,'ayla','sigma','vanilla-elixir','oud-rose');collections.men.splice(0,collections.men.length,'portofino','amicare');collections.unisex.splice(0,collections.unisex.length,'patchouli','casa-blanca','lenden','ajwan');products.forEach(p=>{if(collections.women.includes(p.id))p.collection='Women';else if(collections.men.includes(p.id))p.collection='Men';else if(collections.unisex.includes(p.id))p.collection='Unisex';});syncCatalogFromUrl();});</script></body></html>
